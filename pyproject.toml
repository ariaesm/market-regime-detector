[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-regime-detector"
version = "1.0.0"
description = "Quantitative Machine Learning pipeline to detect, classify and forecast financial market regimes using GMM and Random Forest."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Aria Esmaeilzadeh", email = "aria.esm@gmail.com" },
]
keywords = [
  "machine-learning",
  "quantitative-finance",
  "market-regimes",
  "clustering",
  "gmm",
  "random-forest",
  "backtesting",
  "algorithmic-trading",
  "time-series",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0.0",
]

[project.scripts]
market-regime = "market_regime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
